---
# Dải được phép SSH và vào web. Chỉ LAN nội bộ, không mở ra Internet.
admin_cidr: 192.168.100.0/24
# Cổng web của app (docker-compose.yml: WEB_PORT). Mặc định app chỉ bind 127.0.0.1;
# cần `make lan-up`/override mới ra LAN. Mở ở firewall trước để không phải sửa lại sau.
web_port: 3000
# true: mở web ra LAN (docker-compose.lan.yml, EXPOSE_LAN=true trong .env). App CHƯA có đăng nhập: chỉ bật khi tin toàn bộ
# thiết bị trong dải admin_cidr. API (8000), Postgres, Redis vẫn chỉ nghe 127.0.0.1/nội bộ. Đặt false để chỉ dùng SSH tunnel.
expose_lan: true
repo_url: https://github.com/doanviethung1009/ai_assistant_personal.git
app_root: /srv/builder-ai

# Khoá SSH CÔNG KHAI bổ sung cho user deploy (người/máy khác cần vào quản lý VM). Mỗi phần tử là một dòng
# trong file .pub, nên có comment <chủ sở hữu>@<máy>-<năm>. Thêm bằng cách này thay vì sửa tay trên VM,
# để VM dựng lại vẫn có đủ khoá. Chỉ THÊM, không gỡ khoá: gỡ khoá xem docs/PROXMOX_ACCESS.md mục 5.
# Ví dụ:
#   extra_ssh_keys:
#     - "ssh-ed25519 AAAAC3...xyz hung@macbook-2026"
extra_ssh_keys: []
