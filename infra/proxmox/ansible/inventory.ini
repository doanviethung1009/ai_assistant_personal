# ═══════════════════════════════════════════════════════════════════════
#  Danh sách VM. IP khớp với infra/proxmox/scripts/pve-vm.sh (id VM = octet cuối).
#  `branch` là nhánh git chứa compose/Makefile tương ứng môi trường (git-workflow.md).
# ═══════════════════════════════════════════════════════════════════════
[dev]
ai-dev-01 ansible_host=192.168.100.201 env_name=dev branch=main

[staging]
ai-stg-01 ansible_host=192.168.100.202 env_name=staging branch=uat

[prod]
ai-prod-01 ansible_host=192.168.100.203 env_name=prod branch=prod

[all:vars]
ansible_user=deploy
ansible_python_interpreter=/usr/bin/python3
