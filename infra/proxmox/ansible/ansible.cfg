# ═══════════════════════════════════════════════════════════════════════
#  Cấu hình Ansible cho VM Proxmox của dự án. Chạy từ thư mục này (make pve-config).
# ═══════════════════════════════════════════════════════════════════════
[defaults]
inventory = inventory.ini
roles_path = roles
# Khoá riêng dành cho dự án (tạo ở docs/PROXMOX_DEPLOY.md mục 2.2/13), không dùng khoá cá nhân.
private_key_file = ~/.ssh/ai_assistant_deploy
# Lần đầu gặp VM thì ghi khoá host; nếu khoá ĐỔI sau đó thì SSH từ chối (chống giả mạo).
host_key_checking = accept-new
# Output dễ đọc, gọn.
stdout_callback = default
result_format = yaml
retry_files_enabled = False

[privilege_escalation]
# User deploy có sudo không cần mật khẩu (cloud-init tạo sẵn).
become = True
