global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: onprem
    stack: builder-ai

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Metrics của core API, do app/core/metrics.py expose
  - job_name: builder-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: builder-api

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # ── Probe từ ngoài vào, đây là phần healthcheck của hệ thống ─────────
  # Thêm target mới vào đây khi có service cần theo dõi.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api:8000/health/ready
          - http://web:3000/
        labels:
          probe_type: http
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Kiểm tra cổng TCP còn mở, dùng cho DB và cache
  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - postgres:5432
          - redis:6379
        labels:
          probe_type: tcp
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
