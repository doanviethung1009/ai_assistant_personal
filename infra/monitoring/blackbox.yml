modules:
  http_2xx:
    prober: http
    timeout: 8s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
      # Không gửi API key trong probe. Chỉ probe endpoint công khai.

  # Dành cho endpoint có TLS, sẽ dùng khi ra sau Caddy ở home lab.
  # Prometheus alert dựa vào probe_ssl_earliest_cert_expiry để cảnh báo
  # cert sắp hết hạn.
  http_2xx_tls:
    prober: http
    timeout: 8s
    http:
      valid_status_codes: [200]
      method: GET
      follow_redirects: true
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4

  tcp_connect:
    prober: tcp
    timeout: 5s

  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
