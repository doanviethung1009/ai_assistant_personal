name: builder-ai

# ═══════════════════════════════════════════════════════════════════════
#  Profile:
#    (mặc định)   postgres, redis, api, web
#    llm          + litellm gateway
#    monitoring   + prometheus, grafana, blackbox, exporter
#
#  Cổng của hạ tầng chỉ bind vào 127.0.0.1 để không hở ra LAN.
#  Khi migrate sang home lab, truy cập từ xa đi qua Tailscale hoặc Caddy,
#  không mở port trực tiếp.
# ═══════════════════════════════════════════════════════════════════════

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Dữ liệu ────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: builder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
      # Bắt buộc scram, không trust
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    container_name: builder-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  # ── Ứng dụng ───────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/core
      target: dev
    container_name: builder-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      # Giới hạn request/phút theo X-API-Key, đếm ở Redis. Xem core/rate_limit.py.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
    volumes:
      - ./apps/core:/app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health/live', timeout=3).status == 200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging

  web:
    build:
      context: ./apps/web
      target: dev
    container_name: builder-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      TZ: ${TZ}
      # Chạy phía server của Next.js, không lộ ra browser
      # Mặc định "api" (Postgres qua core API) — đây là chế độ thật, nên
      # giữ nguyên trừ khi có lý do cụ thể. Đặt DATA_SOURCE=file trong .env
      # nếu muốn web ghi vào file JSON ngay cả khi chạy qua Docker (ví dụ
      # demo nhanh không cần giữ dữ liệu qua Postgres). "memory" ít dùng khi
      # đã có Docker vì mất dữ liệu lúc restart — hợp lý nhất khi KHÔNG dùng
      # Docker (make web-demo). Đổi giá trị này đòi `docker compose up -d web`
      # lại để container đọc lại .env, không chỉ sửa file là tự nhận.
      DATA_SOURCE: ${DATA_SOURCE:-api}
      CORE_API_URL: ${CORE_API_URL:-http://api:8000}
      CORE_API_KEY: ${API_KEY}
      # Chỉ dùng khi DATA_SOURCE=file. Mount thêm bên dưới để file JSON nằm
      # trên host (./data), không mất khi container bị xoá.
      DATA_DIR: /data
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      # Cố định timezone hiển thị để SSR và hydrate ra cùng chuỗi ngày giờ
      NEXT_PUBLIC_DISPLAY_TZ: ${TZ}
      # Nơi trang /docs đọc file markdown. Trong container không thấy được gốc
      # repo vì build context chỉ có apps/web, nên phải mount vào.
      DOCS_DIR: /docs
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
      # Chỉ có tác dụng khi DATA_SOURCE=file. Mount vào host để file JSON
      # còn sống qua lần xoá/tạo lại container (không mount thì nó nằm
      # trong filesystem của container, mất khi container bị rm).
      - ./data:/data
      # Tài liệu cho trang /docs, chỉ đọc
      - ./README.md:/docs/README.md:ro
      - ./docs:/docs/docs:ro
      - ./.agents/rules:/docs/.agents/rules:ro
      - ./.agents/skills:/docs/.agents/skills:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    logging: *default-logging

  # ── LLM gateway (profile: llm) ──────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: builder-litellm
    profiles: ["llm"]
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      REDIS_URL: redis://redis:6379/1
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *default-logging

  # ── Monitoring (profile: monitoring) ────────────────────────────────
  #  Scrape /metrics của api + các exporter dưới đây, lưu timeseries 30 ngày.
  #  Config scrape target nằm ở infra/monitoring/prometheus.yml.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: builder-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *default-logging

  # Dashboard đọc dữ liệu từ Prometheus. Datasource provision sẵn qua
  # infra/monitoring/grafana/provisioning, không phải tự thêm bằng UI.
  grafana:
    image: grafana/grafana:11.5.1
    container_name: builder-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      TZ: ${TZ}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    logging: *default-logging

  # Probe HTTP/TCP/ICMP + cảnh báo TLS hết hạn. Đây là nền của healthcheck.
  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    container_name: builder-blackbox
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./infra/monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    ports:
      - "127.0.0.1:${BLACKBOX_PORT:-9115}:9115"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *default-logging

  # Expose số liệu kết nối, transaction, kích thước bảng của Postgres sang
  # Prometheus. Không cần publish port — chỉ Prometheus trong network nội bộ
  # mới cần gọi tới nó.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: builder-postgres-exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  # `pid: host` + mount `rslave` cần Linux Engine thật. Trên Docker Desktop
  # (Windows/macOS, backend WSL2/HyperKit) service này sẽ lỗi khi start —
  # các service monitoring khác không bị ảnh hưởng, chỉ thiếu metrics host
  # (RAM/CPU/disk). Chạy đúng trên Ubuntu production.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: builder-node-exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    logging: *default-logging

  # Số liệu CPU/RAM/network theo từng container (khác node-exporter là
  # theo cả host). privileged: true cần để đọc cgroup và /sys của mọi
  # container khác, không riêng container của chính nó.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: builder-cadvisor
    profiles: ["monitoring"]
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  web_node_modules:
  web_next_cache:

networks:
  default:
    name: builder-ai-net
