[project]
name = "builder-core"
version = "0.1.0"
description = "Builder AI Assistant — core API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "greenlet>=3.1,<4.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "redis>=5.1,<7.0",
    "httpx>=0.27,<1.0",
    "prometheus-client>=0.21,<1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
]

[tool.uv]
# Không build project thành package, chỉ cần dependency trong venv.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
