[alembic]
script_location = migrations
prepend_sys_path = .
# Tên file migration mới có timestamp UTC đứng đầu (vd 2026_10_15_0930-ab12cd34ef56_add_x.py),
# để migration của các nhánh song song xếp theo thời gian tạo và dễ thấy hai nhánh cùng
# sinh migration. Thứ tự áp dụng vẫn do down_revision quyết định, không do tên file.
# File cũ (chưa có timestamp) giữ nguyên tên. Xem .agents/rules/migrations.md.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC
# sqlalchemy.url được nạp từ DATABASE_URL trong migrations/env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
